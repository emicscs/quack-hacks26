<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Mode – Audible Math</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/desmos.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.0.0/math.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
</head>

<body>
    <main role="main" aria-label="Graph mode – explore function with sound">
        <h1>Graph Mode</h1>

        <section aria-label="Expressions" class="expressions-section">
            <div class="expressions-header">
                <span class="expressions-header__label">Expressions</span>
                <select id="function-catalog" title="Quick examples">
                    <option value="">Examples...</option>
                    <option value="sin(x)">sin(x)</option>
                    <option value="x^2">x²</option>
                    <option value="1/x">1/x</option>
                    <option value="sqrt(x)">√x</option>
                    <option value="e^x">eˣ</option>
                </select>
                <button type="button" id="add-expr-btn" class="add-expr-btn" aria-label="Add expression">+ Add</button>
            </div>
            <div id="expr-rows" class="expr-rows"></div>
        </section>

        <div id="graph" role="img" aria-label="Graph of function"></div>

        <section aria-live="polite" aria-atomic="true" id="live-region" class="live-region">
            Current: x = <span id="current-x">0</span>, y = <span id="current-y">0</span>
        </section>

        <section aria-label="Navigation settings">
            <label for="step-size-input">Step size</label>
            <input id="step-size-input" type="number" min="0.1" step="0.1" value="1" inputmode="decimal">
            <label for="max-sound-duration-input">Max sound duration (s)</label>
            <input id="max-sound-duration-input" type="number" min="0.1" step="0.1" value="0.5" inputmode="decimal">
            <p>Step interval: <span id="buffer-seconds">0.2</span>s</p>
            <label for="stop-critical-toggle">
                <input id="stop-critical-toggle" type="checkbox">
                Stop at critical points
            </label>
        </section>

        <p class="instructions">Use <kbd>←</kbd>/<kbd>→</kbd> to move by step size. Tap once for one immediate step,
            hold to repeat using the step interval. Use <kbd>↑</kbd>/<kbd>↓</kbd> to change the step interval by 0.1
            seconds.</p>
        <div id="keyboard-focus-region" tabindex="0" class="visually-hidden"
            aria-label="Graph exploration area. Use arrow keys to move."></div>
    </main>

    <script src="js/math-engine.js"></script>
    <script src="js/graph-state.js"></script>
    <script src="js/sonification.js"></script>
    <script src="js/voice-intro.js"></script>
    <script src="criticalPointDetector.js"></script>
    <script>
        (function initGraphMode() {
            var catalog = document.getElementById("function-catalog");
            var addBtn = document.getElementById("add-expr-btn");
            var rowsContainer = document.getElementById("expr-rows");
            var focusRegion = document.getElementById("keyboard-focus-region");
            var stepInput = document.getElementById("step-size-input");
            var maxSoundDurationInput = document.getElementById("max-sound-duration-input");
            var bufferEl = document.getElementById("buffer-seconds");
            var stopCriticalToggle = document.getElementById("stop-critical-toggle");
            var graphState = window.AudibleMath.graphState;
            var mathEngine = window.AudibleMath.mathEngine;
            var sonification = window.AudibleMath.sonification;
            var voiceIntro = window.AudibleMath.voiceIntro;
            var DEFAULT_MAX_SOUND_DURATION_MS = 500;

            var COLORS = ["#4a9eff", "#e74c3c", "#2ecc71", "#f39c12", "#9b59b6", "#1abc9c", "#e91e63", "#00bcd4"];
            var nextId = 0;
            var expressions = [];
            var debounceTimers = {};

            // ── Expression list management ──

            function addExpression(initialInput) {
                var id = "e" + (nextId++);
                var item = {
                    id: id,
                    input: initialInput || "",
                    expr: "",
                    params: {},
                    paramNames: [],
                    visible: true,
                    color: COLORS[expressions.length % COLORS.length],
                    error: ""
                };
                expressions.push(item);
                revalidate(item);
                createRowDom(item);
                renderGraph();
                return id;
            }

            function removeExpression(id) {
                expressions = expressions.filter(function (e) { return e.id !== id; });
                var el = rowsContainer.querySelector("[data-id=\"" + id + "\"]");
                if (el) el.remove();
                renderGraph();
            }

            function revalidate(item) {
                var text = (item.input || "").trim();
                item.error = "";
                item.expr = "";
                item.paramNames = [];
                if (!text) { item.error = "Enter an expression"; return; }
                var v = mathEngine.validate(text);
                if (!v.valid) { item.error = v.error || "Invalid expression"; return; }
                item.expr = mathEngine.normalizeExpressionInput(text);
                item.paramNames = mathEngine.getParameterNames(text);
                var prev = item.params || {};
                item.params = {};
                item.paramNames.forEach(function (n) {
                    item.params[n] = prev[n] != null ? prev[n] : 1;
                });
            }

            function getVisible() {
                return expressions.filter(function (e) { return e.visible && e.expr; });
            }

            // ── Row DOM ──

            function renderLatex(text, el) {
                if (!el) return;
                var latex = mathEngine.toTex(text);
                if (typeof katex !== "undefined" && latex) {
                    try {
                        el.innerHTML = katex.renderToString(latex, { throwOnError: false, displayMode: false });
                        el.classList.remove("desmos-row__preview--empty", "desmos-row__preview--error");
                    } catch (e) { el.textContent = latex; }
                } else {
                    el.textContent = latex || "";
                    el.classList.toggle("desmos-row__preview--empty", !latex);
                }
            }

            function createRowDom(item) {
                var row = document.createElement("div");
                row.className = "expr-row";
                row.dataset.id = item.id;
                row.innerHTML =
                    "<div class=\"expr-row__header\">" +
                    "  <button type=\"button\" class=\"expr-visibility-btn\" title=\"Show/hide\">\u25CF</button>" +
                    "  <span class=\"expr-row__color\" style=\"background:" + item.color + "\"></span>" +
                    "  <input type=\"text\" class=\"expr-row__input\" placeholder=\"y = ...\" value=\"" + (item.input || "").replace(/"/g, "&quot;") + "\" autocomplete=\"off\" spellcheck=\"false\" />" +
                    "  <button type=\"button\" class=\"expr-row__delete\" title=\"Remove\">\u00D7</button>" +
                    "</div>" +
                    "<div class=\"expr-row__preview desmos-row__preview--empty\"></div>" +
                    "<div class=\"expr-row__error\" style=\"display:none\"></div>" +
                    "<div class=\"expr-row__sliders\"></div>";

                var inputEl = row.querySelector(".expr-row__input");
                var previewEl = row.querySelector(".expr-row__preview");
                var errorEl = row.querySelector(".expr-row__error");
                var slidersEl = row.querySelector(".expr-row__sliders");
                var visBtn = row.querySelector(".expr-visibility-btn");
                var delBtn = row.querySelector(".expr-row__delete");

                function syncUi() {
                    visBtn.textContent = item.visible ? "\u25CF" : "\u25CB";
                    visBtn.style.color = item.visible ? item.color : "";
                    visBtn.classList.toggle("expr-visibility-btn--off", !item.visible);
                    row.classList.toggle("expr-row--error", !!item.error);
                    row.classList.toggle("expr-row--hidden", !item.visible);
                    errorEl.textContent = item.error || "";
                    errorEl.style.display = item.error ? "block" : "none";
                    renderLatex(item.input, previewEl);
                    buildSliders(item, slidersEl);
                }

                function flush() {
                    var val = inputEl.value.trim();
                    if (val === item.input) return;
                    item.input = val;
                    revalidate(item);
                    syncUi();
                    renderGraph();
                }

                function schedule() {
                    if (debounceTimers[item.id]) clearTimeout(debounceTimers[item.id]);
                    debounceTimers[item.id] = setTimeout(function () {
                        debounceTimers[item.id] = null;
                        flush();
                    }, 120);
                }

                inputEl.addEventListener("input", function () {
                    renderLatex(this.value, previewEl);
                    row.classList.remove("expr-row--error");
                    errorEl.style.display = "none";
                    schedule();
                });
                inputEl.addEventListener("blur", flush);
                inputEl.addEventListener("keydown", function (e) {
                    if (e.key === "Enter") { flush(); inputEl.blur(); }
                });

                visBtn.addEventListener("click", function () {
                    item.visible = !item.visible;
                    syncUi();
                    renderGraph();
                });

                delBtn.addEventListener("click", function () {
                    removeExpression(item.id);
                });

                syncUi();
                rowsContainer.appendChild(row);
                return row;
            }

            function buildSliders(item, container) {
                if (!container) return;
                container.innerHTML = "";
                if (!item.paramNames || !item.paramNames.length) return;
                item.paramNames.forEach(function (name) {
                    var wrap = document.createElement("div");
                    wrap.className = "desmos-row__slider-wrap";
                    var label = document.createElement("label");
                    label.textContent = name + ":";
                    var slider = document.createElement("input");
                    slider.type = "range";
                    slider.className = "desmos-row__slider";
                    slider.min = -10; slider.max = 10; slider.step = 0.1;
                    slider.value = item.params[name] != null ? item.params[name] : 1;
                    var span = document.createElement("span");
                    span.className = "desmos-row__slider-value";
                    span.textContent = slider.value;
                    slider.addEventListener("input", function () {
                        var v = parseFloat(this.value);
                        span.textContent = Number.isInteger(v) ? v : v.toFixed(2);
                        item.params[name] = v;
                        renderGraph();
                    });
                    wrap.appendChild(label);
                    wrap.appendChild(slider);
                    wrap.appendChild(span);
                    container.appendChild(wrap);
                });
            }

            // ── Critical points for a single expression ──

            function evalExpr(expr, x, params) {
                return mathEngine.evaluate(expr, x, params);
            }

            function derivativeOf(expr, x, params) {
                var h = 1e-4;
                var yL = evalExpr(expr, x - h, params);
                var yR = evalExpr(expr, x + h, params);
                if (isNaN(yL) || isNaN(yR)) return NaN;
                return (yR - yL) / (2 * h);
            }

            function derivative2Of(expr, x, params) {
                var h = 1e-4;
                var dL = derivativeOf(expr, x - h, params);
                var dR = derivativeOf(expr, x + h, params);
                if (isNaN(dL) || isNaN(dR)) return NaN;
                return (dR - dL) / (2 * h);
            }

            function signFlip(a, b) {
                return (a > 0 && b < 0) || (a < 0 && b > 0);
            }

            function refineTurning(expr, params, lx, rx, ld, rd) {
                for (var i = 0; i < 20; i++) {
                    var mx = (lx + rx) / 2;
                    var md = derivativeOf(expr, mx, params);
                    if (isNaN(md) || Math.abs(md) < 1e-4) return mx;
                    if (signFlip(ld, md)) { rx = mx; rd = md; }
                    else { lx = mx; ld = md; }
                }
                return (lx + rx) / 2;
            }

            function refineInflection(expr, params, lx, rx, ld2, rd2) {
                for (var i = 0; i < 20; i++) {
                    var mx = (lx + rx) / 2;
                    var md2 = derivative2Of(expr, mx, params);
                    if (isNaN(md2) || Math.abs(md2) < 1e-6) return mx;
                    if (signFlip(ld2, md2)) { rx = mx; } else { lx = mx; }
                }
                return (lx + rx) / 2;
            }

            function computeCriticalPoints(expr, params, domain, step) {
                var pts = [];
                var data = mathEngine.sample(expr, domain.min, domain.max, step, params);
                var xs = data.x, ys = data.y;
                if (xs.length < 3) return pts;
                var eps = 1e-6;

                for (var i = 1; i < ys.length - 1; i++) {
                    var dp = ys[i] - ys[i - 1], dn = ys[i + 1] - ys[i];
                    var ps = dp > eps ? 1 : (dp < -eps ? -1 : 0);
                    var ns = dn > eps ? 1 : (dn < -eps ? -1 : 0);
                    if (ps > 0 && ns < 0) {
                        var ld = derivativeOf(expr, xs[i - 1], params), rd = derivativeOf(expr, xs[i + 1], params);
                        var rx = refineTurning(expr, params, xs[i - 1], xs[i + 1], ld, rd);
                        var ry = evalExpr(expr, rx, params);
                        if (isFinite(ry)) pts.push({ x: rx, y: ry, type: "max" });
                    } else if (ps < 0 && ns > 0) {
                        var ld = derivativeOf(expr, xs[i - 1], params), rd = derivativeOf(expr, xs[i + 1], params);
                        var rx = refineTurning(expr, params, xs[i - 1], xs[i + 1], ld, rd);
                        var ry = evalExpr(expr, rx, params);
                        if (isFinite(ry)) pts.push({ x: rx, y: ry, type: "min" });
                    }
                }

                var d2Prev = null, xPrev = null;
                for (var k = 0; k < xs.length; k++) {
                    var d2 = derivative2Of(expr, xs[k], params);
                    if (!isFinite(d2)) { d2Prev = null; xPrev = null; continue; }
                    if (d2Prev !== null && signFlip(d2Prev, d2)) {
                        var ix = refineInflection(expr, params, xPrev, xs[k], d2Prev, d2);
                        var iy = evalExpr(expr, ix, params);
                        if (isFinite(iy)) pts.push({ x: ix, y: iy, type: "inflection" });
                    }
                    d2Prev = d2;
                    xPrev = xs[k];
                }

                return pts;
            }

            // ── Intersection detection ──

            function findIntersections(exprA, paramsA, exprB, paramsB, domain, step) {
                var pts = [];
                var xMin = domain.min, xMax = domain.max;
                var prevX = xMin;
                var prevDiff = evalExpr(exprA, xMin, paramsA) - evalExpr(exprB, xMin, paramsB);

                for (var xi = xMin + step; xi <= xMax; xi += step) {
                    var yA = evalExpr(exprA, xi, paramsA);
                    var yB = evalExpr(exprB, xi, paramsB);
                    if (!isFinite(yA) || !isFinite(yB)) { prevDiff = NaN; prevX = xi; continue; }
                    var diff = yA - yB;
                    if (isFinite(prevDiff) && (signFlip(prevDiff, diff) || Math.abs(diff) < 1e-8)) {
                        var lx = prevX, rx = xi, ld = prevDiff, rd = diff;
                        for (var it = 0; it < 30; it++) {
                            var mx = (lx + rx) / 2;
                            var md = evalExpr(exprA, mx, paramsA) - evalExpr(exprB, mx, paramsB);
                            if (!isFinite(md)) break;
                            if (Math.abs(md) < 1e-8) { lx = rx = mx; break; }
                            if (signFlip(ld, md)) { rx = mx; rd = md; }
                            else { lx = mx; ld = md; }
                        }
                        var ix = (lx + rx) / 2;
                        var iy = evalExpr(exprA, ix, paramsA);
                        if (isFinite(iy)) {
                            var dup = false;
                            for (var p = 0; p < pts.length; p++) {
                                if (Math.abs(pts[p].x - ix) < step * 0.5) { dup = true; break; }
                            }
                            if (!dup) pts.push({ x: ix, y: iy });
                        }
                    }
                    prevDiff = diff;
                    prevX = xi;
                }
                return pts;
            }

            // ── Graph rendering ──

            var STEP = 0.1;
            var DOMAIN = graphState.getViewWindow ? graphState.getViewWindow() : { min: -2 * Math.PI, max: 2 * Math.PI };

            function critLabel(type) {
                if (type === "max") return "local max";
                if (type === "min") return "local min";
                if (type === "inflection") return "inflection";
                return "critical";
            }

            function critSymbol(type) {
                if (type === "max") return "triangle-up";
                if (type === "min") return "triangle-down";
                if (type === "inflection") return "diamond";
                return "circle-open";
            }

            function renderGraph() {
                if (typeof Plotly === "undefined") return;
                var graphDiv = document.getElementById("graph");
                if (!graphDiv) return;
                var activeWindow = graphState.getViewWindow ? graphState.getViewWindow() : DOMAIN;
                DOMAIN = { min: activeWindow.min, max: activeWindow.max };

                var visible = getVisible();
                var traces = [];

                visible.forEach(function (item) {
                    var data = mathEngine.sample(item.expr, DOMAIN.min, DOMAIN.max, STEP, item.params);
                    traces.push({
                        x: data.x,
                        y: data.y,
                        mode: "lines",
                        type: "scatter",
                        name: item.input || item.expr,
                        line: { color: item.color, width: 2 },
                        connectgaps: false,
                        hovertemplate: "(%{x:.2f}, %{y:.2f})<extra>" + (item.input || item.expr) + "</extra>"
                    });

                    var crits = computeCriticalPoints(item.expr, item.params, DOMAIN, STEP);
                    if (crits.length) {
                        traces.push({
                            x: crits.map(function (p) { return p.x; }),
                            y: crits.map(function (p) { return p.y; }),
                            mode: "markers",
                            type: "scatter",
                            name: "critical (" + (item.input || item.expr) + ")",
                            marker: {
                                color: item.color,
                                size: 9,
                                symbol: crits.map(function (p) { return critSymbol(p.type); }),
                                line: { color: "#fff", width: 1 }
                            },
                            customdata: crits.map(function (p) { return critLabel(p.type); }),
                            hovertemplate: "(%{x:.2f}, %{y:.2f})<br>%{customdata}<extra></extra>",
                            showlegend: false
                        });
                    }
                });

                // Intersection points between all pairs of visible expressions
                var allIntersections = [];
                for (var i = 0; i < visible.length; i++) {
                    for (var j = i + 1; j < visible.length; j++) {
                        var ints = findIntersections(
                            visible[i].expr, visible[i].params,
                            visible[j].expr, visible[j].params,
                            DOMAIN, STEP
                        );
                        ints.forEach(function (p) {
                            p.labelA = visible[i].input || visible[i].expr;
                            p.labelB = visible[j].input || visible[j].expr;
                        });
                        allIntersections = allIntersections.concat(ints);
                    }
                }
                if (allIntersections.length) {
                    traces.push({
                        x: allIntersections.map(function (p) { return p.x; }),
                        y: allIntersections.map(function (p) { return p.y; }),
                        mode: "markers",
                        type: "scatter",
                        name: "intersections",
                        marker: {
                            color: "#fff",
                            size: 10,
                            symbol: "x",
                            line: { color: "#000", width: 1.5 }
                        },
                        customdata: allIntersections.map(function (p) { return p.labelA + " \u2229 " + p.labelB; }),
                        hovertemplate: "(%{x:.2f}, %{y:.2f})<br>%{customdata}<extra>intersection</extra>"
                    });
                }

                if (traces.length === 0) {
                    traces = [{ x: [], y: [], mode: "lines", type: "scatter" }];
                }

                var layout = {
                    paper_bgcolor: "#1a1a1a",
                    plot_bgcolor: "#252525",
                    font: { color: "#e8e8e8", size: 12 },
                    hovermode: "closest",
                    xaxis: {
                        title: "x",
                        gridcolor: "#333",
                        zerolinecolor: "#555",
                        showspikes: false,
                        range: [DOMAIN.min, DOMAIN.max]
                    },
                    yaxis: { title: "y", gridcolor: "#333", zerolinecolor: "#555", showspikes: false },
                    margin: { t: 40, r: 40, b: 50, l: 60 },
                    showlegend: true,
                    legend: { font: { size: 11 }, bgcolor: "rgba(0,0,0,0.3)" }
                };

                Plotly.newPlot(graphDiv, traces, layout, { responsive: true });

                var first = visible[0];
                if (first) {
                    graphState.setFunction(first.expr, { preserveView: true });
                    if (graphState.setFunctionParams) graphState.setFunctionParams(first.params);
                } else {
                    graphState.setFunction("0", { preserveView: true });
                    if (graphState.setFunctionParams) graphState.setFunctionParams({});
                }
                graphState.updateCursorDisplay();
                if (graphState.updatePlotlyCursor) graphState.updatePlotlyCursor();
            }

            // ── Catalog fills a new row ──

            catalog.addEventListener("change", function () {
                if (!catalog.value) return;
                addExpression("y = " + catalog.value);
                catalog.value = "";
            });

            addBtn.addEventListener("click", function () {
                addExpression("");
                var rows = rowsContainer.querySelectorAll(".expr-row__input");
                if (rows.length) rows[rows.length - 1].focus();
            });

            // ── Sonification / cursor / settings (unchanged) ──

            var criticalPoints = window.CriticalPointDetector && CriticalPointDetector.integrate({
                graphSelector: "#graph",
                getData: function () {
                    var d = graphState.dataXY;
                    if (!d || !d.x || !d.y) return null;
                    var out = { x: d.x.slice(), y: d.y.slice() };
                    if (graphState.getCriticalPoints) out.criticalPoints = graphState.getCriticalPoints();
                    return out;
                },
                getCursorX: function () { return graphState.currentX; },
                onCursorChange: function (x, y, isValid) { sonification.setFrequencyFromY(y, isValid); }
            });
            if (criticalPoints) window.criticalPoints = criticalPoints;

            graphState.onCursorChange = criticalPoints ? criticalPoints.cursorHandler : function (x, y, isValid) {
                sonification.setFrequencyFromY(y, isValid);
            };
            graphState.onViewWindowChange = function (minX, maxX) {
                DOMAIN = { min: minX, max: maxX };
                renderGraph();
            };

            function formatDurationSeconds(ms) {
                return (ms / 1000).toFixed(1);
            }

            function applyMaxSoundDurationFromInput() {
                if (!maxSoundDurationInput || !sonification || !sonification.setMaxPlaybackMs) return;
                var seconds = parseFloat(maxSoundDurationInput.value);
                if (!isFinite(seconds) || seconds <= 0) {
                    maxSoundDurationInput.value = formatDurationSeconds(sonification.getMaxPlaybackMs ? sonification.getMaxPlaybackMs() : DEFAULT_MAX_SOUND_DURATION_MS);
                    return;
                }
                var appliedMs = sonification.setMaxPlaybackMs(seconds * 1000);
                maxSoundDurationInput.value = formatDurationSeconds(appliedMs);
            }

            function updateSettingsUi(stepSize, repeatDelayMs, shouldStopAtCritical) {
                if (stepInput) stepInput.value = String(stepSize);
                if (bufferEl) bufferEl.textContent = (repeatDelayMs / 1000).toFixed(1);
                if (stopCriticalToggle) stopCriticalToggle.checked = !!shouldStopAtCritical;
                if (maxSoundDurationInput && sonification && sonification.getMaxPlaybackMs) {
                    maxSoundDurationInput.value = formatDurationSeconds(sonification.getMaxPlaybackMs());
                }
            }

            graphState.onSettingsChange = function (s, r, c) { updateSettingsUi(s, r, c); };

            if (stepInput) {
                stepInput.addEventListener("change", function () {
                    if (!graphState.setCursorStep(stepInput.value)) stepInput.value = String(graphState.getCursorStep());
                });
                stepInput.addEventListener("blur", function () {
                    if (!graphState.setCursorStep(stepInput.value)) stepInput.value = String(graphState.getCursorStep());
                });
            }
            if (maxSoundDurationInput) {
                maxSoundDurationInput.addEventListener("change", applyMaxSoundDurationFromInput);
                maxSoundDurationInput.addEventListener("blur", applyMaxSoundDurationFromInput);
            }
            if (stopCriticalToggle) {
                stopCriticalToggle.addEventListener("change", function () {
                    graphState.setStopAtCriticalPoints(stopCriticalToggle.checked);
                });
            }

            // ── Init ──

            if (sonification && sonification.setMaxPlaybackMs) {
                var initialDurationSeconds = maxSoundDurationInput ? parseFloat(maxSoundDurationInput.value) : NaN;
                var initialDurationMs = isFinite(initialDurationSeconds) && initialDurationSeconds > 0
                    ? initialDurationSeconds * 1000
                    : DEFAULT_MAX_SOUND_DURATION_MS;
                sonification.setMaxPlaybackMs(initialDurationMs);
            }
            graphState.init();
            addExpression("y = sin(x)");
            updateSettingsUi(graphState.getCursorStep(), graphState.getRepeatDelayMs(), graphState.getStopAtCriticalPoints());

            if (focusRegion) focusRegion.focus();
        })();
    </script>
</body>

</html>
